<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬡ 3D Model Viewer</title>

    <style>
        body {
            background: #0a0a0f;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .controls {
            background: rgba(0, 20, 20, 0.9);
            border: 1px solid #00ffcc44;
            border-radius: 8px;
            padding: 16px;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            box-shadow: 0 0 20px #00ffcc22;
            height: fit-content;
            flex-shrink: 0;
        }

        .container {
            font-family: 'Courier New', monospace;
            font-size: 4px;
            line-height: 5px;
            letter-spacing: 1px;
            color: #00ffcc;
            text-shadow: 0 0 4px #00ffcc44;
            white-space: pre;
            flex: 1;
            min-width: 0;
            overflow: auto;
        }

        .controls h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            text-shadow: 0 0 8px #00ffcc66;
        }

        .controls label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .controls input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: #00ffcc22;
            box-shadow: 0 0 12px #00ffcc44;
        }

        .model-info {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #00ffcc33;
            font-size: 11px;
            color: #00ffcc99;
        }

        .model-select {
            margin-top: 12px;
        }

        .model-select button {
            background: transparent;
            border: 1px solid #00ffcc55;
            color: #00ffcc;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }

            .controls {
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
            }

            .controls h3 {
                font-size: 16px;
                text-align: center;
            }

            .model-select {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4px;
            }

            .model-select button {
                padding: 8px 12px;
                font-size: 12px;
                margin: 0;
            }

            .upload-btn {
                display: block;
                text-align: center;
                padding: 12px 16px;
            }

            .container {
                width: 100%;
                overflow: auto;
                font-size: 3px;
                line-height: 4px;
                letter-spacing: 0.5px;
            }

            .model-info {
                font-size: 10px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                font-size: 2.5px;
                line-height: 3.5px;
                letter-spacing: 0.3px;
            }

            .model-select button {
                padding: 6px 8px;
                font-size: 10px;
            }
        }

        .model-select button:hover,
        .model-select button.active {
            background: #00ffcc33;
            border-color: #00ffcc;
        }

        .game-links {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #00ffcc33;
        }

        .game-links a {
            display: block;
            color: #ff0080;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.2s;
            margin: 6px 0;
        }

        .game-links a:hover {
            text-shadow: 0 0 8px #ff008066;
        }

        .game-links a.shooter {
            color: #ff3300;
        }

        .game-links a.shooter:hover {
            text-shadow: 0 0 8px #ff330066;
        }

        .render-controls {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #00ffcc33;
        }

        .render-controls h4 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #00ffcc;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 10px;
            color: #00ffcc99;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin: 4px 0;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: #00ffcc33;
            border-radius: 2px;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px #00ffcc66;
        }

        .control-group input[type="range"]::-moz-range-track {
            height: 4px;
            background: #00ffcc33;
            border-radius: 2px;
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #00ffcc;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px #00ffcc66;
        }

        .control-group input[type="range"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-group input[type="range"]:disabled::-webkit-slider-thumb {
            background: #00ffcc66;
            cursor: not-allowed;
        }

        .control-group input[type="range"]:disabled::-moz-range-thumb {
            background: #00ffcc66;
            cursor: not-allowed;
        }

        .control-group input[type="checkbox"] {
            margin-right: 6px;
            cursor: pointer;
        }

        .control-group small {
            display: block;
            margin-top: 2px;
        }

        .control-value {
            display: inline-block;
            margin-left: 6px;
            font-size: 10px;
            color: #00ffcc;
            min-width: 40px;
        }

        .obj-controls {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #00ffcc33;
            display: none;
        }

        .obj-controls.active {
            display: block;
        }

        .obj-controls button {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 12px;
            margin-top: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
            width: 100%;
        }

        .obj-controls button:hover {
            background: #00ffcc22;
            box-shadow: 0 0 12px #00ffcc44;
        }

        .obj-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="controls">
        <h3>⬡ 3D Model Viewer</h3>
        <label>
            <span class="upload-btn">📁 Upload OBJ</span>
            <input type="file" id="objFile" accept=".obj">
        </label>
        <div class="model-select">
            <button data-model="cube">1: Cube</button>
            <button data-model="pyramid">2: Pyramid</button>
            <button data-model="tetrahedron">3: Tetra</button>
            <button data-model="octahedron">4: Octa</button>
            <button data-model="icosahedron">5: Icosa</button>
            <button data-model="sphere">6: Sphere</button>
            <button data-model="torus" class="active">7: Torus</button>
            <button data-model="text3d">8: 3D</button>
            <button data-model="hello">9: HELLO</button>
        </div>
        <div class="model-info" id="modelInfo">
            Vertices: 0 | Edges: 0
        </div>
        <div class="model-info" id="fpsDisplay" style="color: #ffcc00;">
            0 FPS
        </div>
        <div class="obj-controls" id="objControls">
            <h4>📦 OBJ Model Settings</h4>
            <div class="control-group">
                <label>
                    Target Height:
                    <span class="control-value" id="objHeightValue">1.0</span>
                </label>
                <input type="range" id="objHeightSlider" min="0.1" max="3" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="objCenter" checked>
                    Center Model
                </label>
            </div>
            <div class="control-group">
                <label>
                    Max Edges (Simplify):
                    <span class="control-value" id="objMaxEdgesValue">All</span>
                </label>
                <input type="range" id="objMaxEdgesSlider" min="0" max="5000" step="100" value="0">
                <small style="color: #00ffcc66; font-size: 9px;">0 = All edges (disabled)</small>
            </div>
            <div class="control-group">
                <label>
                    Simplify Factor:
                    <span class="control-value" id="objSimplifyValue">1</span>
                </label>
                <input type="range" id="objSimplifySlider" min="1" max="20" step="1" value="1">
                <small style="color: #00ffcc66; font-size: 9px;">Keep every Nth edge (1 = no simplification)</small>
            </div>
            <button id="reprocessOBJ">🔄 Reprocess OBJ</button>
        </div>
        <div class="render-controls">
            <h4>⚙️ Render Settings</h4>
            <div class="control-group">
                <label>
                    Detail Level (LOD):
                    <span class="control-value" id="lodValue">500</span>
                </label>
                <input type="range" id="lodSlider" min="50" max="2000" step="50" value="500">
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="showVertices" checked>
                    Show Vertices
                </label>
            </div>
            <div class="control-group">
                <label>
                    Rotation Speed:
                    <span class="control-value" id="rotSpeedValue">1.0x</span>
                </label>
                <input type="range" id="rotSpeedSlider" min="0" max="3" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>
                    Scale:
                    <span class="control-value" id="scaleValue">1.0</span>
                </label>
                <input type="range" id="scaleSlider" min="0.1" max="2" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>
                    Depth Shading:
                    <span class="control-value" id="shadingValue">On</span>
                </label>
                <input type="checkbox" id="depthShading" checked>
            </div>
        </div>
        <div class="game-links">
            🎮 <a href="game.html">Play VOID RUNNER →</a><br>
            ☠ <a href="shooter.html" class="shooter">Play HELL CORRIDOR →</a>
        </div>
    </div>

    <div class="container">
    </div>

    <script type="module">
        import * as Engine from './engine.js'
        import * as Models from './models.js'
        import * as OBJLoader from './obj-loader.js'

        const container = /** @type {HTMLDivElement} */ (document.querySelector('.container'))

        // Responsive dimensions based on screen size
        const getResponsiveDimensions = () => {
            const screenWidth = window.innerWidth
            if (screenWidth <= 480) {
                return { width: 140, height: 100 }
            } else if (screenWidth <= 768) {
                return { width: 180, height: 120 }
            } else {
                return { width: 220, height: 140 }
            }
        }

        let dimensions = getResponsiveDimensions()

        // Create reusable buffer
        let frameBuffer = Engine.createBuffer(dimensions.width, dimensions.height)

        // Handle resize
        window.addEventListener('resize', () => {
            const newDimensions = getResponsiveDimensions()
            if (newDimensions.width !== dimensions.width || newDimensions.height !== dimensions.height) {
                dimensions = newDimensions
                frameBuffer = Engine.createBuffer(dimensions.width, dimensions.height)
            }
        })

        // Render settings
        let renderSettings = {
            maxEdges: 500,
            showVertices: true,
            rotationSpeed: 1.0,
            scale: 1.0,
            depthShading: true
        }

        // Available models - now from models.js
        const models = {
            cube: Models.createCube(0.5),
            pyramid: Models.createPyramid(0.5, 0.7),
            tetrahedron: Models.createTetrahedron(0.6),
            octahedron: Models.createOctahedron(0.5),
            icosahedron: Models.createIcosahedron(0.5),
            sphere: Models.createSphere(0.5, 16, 10),
            torus: Models.createTorus(0.35, 0.15, 20, 10),
            text3d: Models.createText3D(0.6),
            hello: Models.createTextHello(0.25),
        }

        // Current model
        let currentModel = models.torus

        // OBJ model state
        let rawOBJContent = null
        let rawOBJFileName = null
        let objProcessingSettings = {
            targetHeight: 1.0,
            center: true,
            maxEdges: null,
            simplifyFactor: 1
        }

        let angleX = 0
        let angleY = 0
        let angleZ = 0

        // FPS tracking
        let lastTime = performance.now()
        let frameCount = 0
        let fps = 0

        const animate = () => {
            // FPS calculation
            frameCount++
            const now = performance.now()
            if (now - lastTime >= 1000) {
                fps = frameCount
                frameCount = 0
                lastTime = now
                updateFPS(fps)
            }

            Engine.clearBuffer(frameBuffer)

            const transformed = Engine.transformModel(currentModel, {
                rx: angleX,
                ry: angleY,
                rz: angleZ,
                tz: 2,
                scale: renderSettings.scale
            })

            // Apply render settings
            const maxEdges = currentModel.edges.length > renderSettings.maxEdges
                ? renderSettings.maxEdges
                : Infinity

            const lineChar = renderSettings.depthShading ? undefined : '·'

            Engine.renderModel(frameBuffer, currentModel, transformed, container, dimensions, {
                maxEdges,
                showVertices: renderSettings.showVertices,
                lineChar
            })
            Engine.flushBuffer(frameBuffer, container)

            const rotSpeed = renderSettings.rotationSpeed
            angleX += 0.02 * rotSpeed
            angleY += 0.03 * rotSpeed
            angleZ += 0.01 * rotSpeed

            requestAnimationFrame(animate)
        }

        // Update FPS display
        const updateFPS = (fps) => {
            const el = document.getElementById('fpsDisplay')
            if (el) el.textContent = `${fps} FPS`
        }

        // Update model info display
        const updateModelInfo = (model, name = '') => {
            const info = document.getElementById('modelInfo')
            if (info) {
                const nameStr = name ? `${name} | ` : ''
                const lodInfo = model.edges.length > renderSettings.maxEdges
                    ? ` | LOD: ${renderSettings.maxEdges}/${model.edges.length}`
                    : ''
                info.textContent = `${nameStr}Verts: ${model.vertices.length} | Edges: ${model.edges.length}${lodInfo}`
            }
        }

        // Render controls handlers
        const lodSlider = /** @type {HTMLInputElement} */ (document.getElementById('lodSlider'))
        const lodValue = document.getElementById('lodValue')
        lodSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value)
            renderSettings.maxEdges = value
            lodValue.textContent = value.toString()
            updateModelInfo(currentModel)
        })

        const showVerticesCheck = /** @type {HTMLInputElement} */ (document.getElementById('showVertices'))
        showVerticesCheck.addEventListener('change', (e) => {
            renderSettings.showVertices = e.target.checked
        })

        const rotSpeedSlider = /** @type {HTMLInputElement} */ (document.getElementById('rotSpeedSlider'))
        const rotSpeedValue = document.getElementById('rotSpeedValue')
        rotSpeedSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value)
            renderSettings.rotationSpeed = value
            rotSpeedValue.textContent = `${value.toFixed(1)}x`
        })

        const scaleSlider = /** @type {HTMLInputElement} */ (document.getElementById('scaleSlider'))
        const scaleValue = document.getElementById('scaleValue')
        scaleSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value)
            renderSettings.scale = value
            scaleValue.textContent = value.toFixed(1)
        })

        const depthShadingCheck = /** @type {HTMLInputElement} */ (document.getElementById('depthShading'))
        const shadingValue = document.getElementById('shadingValue')
        depthShadingCheck.addEventListener('change', (e) => {
            renderSettings.depthShading = e.target.checked
            shadingValue.textContent = e.target.checked ? 'On' : 'Off'
        })

        // Update active button state
        const updateActiveButton = (modelName) => {
            document.querySelectorAll('.model-select button').forEach(el => {
                const btn = /** @type {HTMLButtonElement} */ (el)
                btn.classList.toggle('active', btn.dataset.model === modelName)
            })
        }

        // Switch model helper
        const switchModel = (modelName) => {
            if (models[modelName]) {
                currentModel = models[modelName]
                updateModelInfo(currentModel, modelName)
                updateActiveButton(modelName)

                // Hide OBJ controls if switching to a built-in model
                const objControls = document.getElementById('objControls')
                if (objControls && modelName !== 'custom') {
                    objControls.classList.remove('active')
                } else if (objControls && modelName === 'custom' && rawOBJContent) {
                    objControls.classList.add('active')
                }
            }
        }

        // Keyboard controls to switch models
        document.addEventListener('keydown', (e) => {
            const modelKeys = { '1': 'cube', '2': 'pyramid', '3': 'tetrahedron', '4': 'octahedron', '5': 'icosahedron', '6': 'sphere', '7': 'torus', '8': 'text3d', '9': 'hello' }
            if (modelKeys[e.key]) {
                switchModel(modelKeys[e.key])
            }
        })

        // Button controls
        document.querySelectorAll('.model-select button').forEach(el => {
            const btn = /** @type {HTMLButtonElement} */ (el)
            btn.addEventListener('click', () => {
                const modelName = btn.dataset.model
                if (modelName) switchModel(modelName)
            })
        })

        // Process OBJ model with current settings
        const processOBJModel = (content, fileName) => {
            try {
                const parsed = Engine.parseOBJ(content)

                // Validate parsed model
                if (!parsed.vertices || parsed.vertices.length === 0) {
                    throw new Error('OBJ file has no valid vertices')
                }
                if (!parsed.edges || parsed.edges.length === 0) {
                    console.warn('OBJ file has no edges - model may not render correctly')
                }

                // Use OBJLoader utilities for better processing
                let processedVertices = parsed.vertices
                if (objProcessingSettings.center) {
                    processedVertices = OBJLoader.centerAndScale(processedVertices, objProcessingSettings.targetHeight)
                } else {
                    processedVertices = OBJLoader.scaleToHeight(processedVertices, objProcessingSettings.targetHeight)
                }

                // Validate and filter edges to ensure all indices are valid
                const maxVertexIndex = processedVertices.length - 1
                let processedEdges = parsed.edges.filter(([a, b]) => {
                    return typeof a === 'number' && typeof b === 'number' &&
                        a >= 0 && b >= 0 &&
                        a <= maxVertexIndex && b <= maxVertexIndex &&
                        a !== b
                })

                // Simplify edges - maxEdges takes priority over simplifyFactor
                if (objProcessingSettings.maxEdges !== null && objProcessingSettings.maxEdges > 0) {
                    const simplified = OBJLoader.simplifyToMaxEdges(
                        { vertices: processedVertices, edges: processedEdges },
                        objProcessingSettings.maxEdges
                    )
                    processedEdges = simplified.edges
                } else if (objProcessingSettings.simplifyFactor > 1) {
                    const simplified = OBJLoader.simplifyModel(
                        { vertices: processedVertices, edges: processedEdges },
                        objProcessingSettings.simplifyFactor
                    )
                    processedEdges = simplified.edges
                }

                // Final validation pass
                processedEdges = processedEdges.filter(([a, b]) => {
                    return typeof a === 'number' && typeof b === 'number' &&
                        a >= 0 && b >= 0 &&
                        a < processedVertices.length && b < processedVertices.length &&
                        a !== b
                })

                const model = {
                    vertices: processedVertices,
                    edges: processedEdges
                }

                console.log(`Processed OBJ: ${model.vertices.length} vertices, ${model.edges.length} edges`)

                currentModel = model
                models['custom'] = model
                updateModelInfo(model, fileName)
                updateActiveButton('')
            } catch (err) {
                console.error('Failed to process OBJ:', err)
                alert(`Failed to process OBJ file: ${err.message}`)
            }
        }

        // File upload handler
        const fileInput = /** @type {HTMLInputElement} */ (document.getElementById('objFile'))
        fileInput.addEventListener('change', (e) => {
            const file = fileInput.files?.[0]
            if (!file) return

            const reader = new FileReader()
            reader.onload = (event) => {
                const content = /** @type {string} */ (event.target?.result)
                if (!content) return

                rawOBJContent = content
                rawOBJFileName = file.name

                // Show OBJ controls
                const objControls = document.getElementById('objControls')
                if (objControls) {
                    objControls.classList.add('active')
                }

                // Process with default settings
                processOBJModel(content, file.name)
            }
            reader.readAsText(file)
        })

        // OBJ processing controls
        const objHeightSlider = /** @type {HTMLInputElement} */ (document.getElementById('objHeightSlider'))
        const objHeightValue = document.getElementById('objHeightValue')
        objHeightSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value)
            objProcessingSettings.targetHeight = value
            objHeightValue.textContent = value.toFixed(1)
        })

        const objCenterCheck = /** @type {HTMLInputElement} */ (document.getElementById('objCenter'))
        objCenterCheck.addEventListener('change', (e) => {
            objProcessingSettings.center = e.target.checked
        })

        const objMaxEdgesSlider = /** @type {HTMLInputElement} */ (document.getElementById('objMaxEdgesSlider'))
        const objMaxEdgesValue = document.getElementById('objMaxEdgesValue')
        objMaxEdgesSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value)
            if (value === 0) {
                objProcessingSettings.maxEdges = null
                objMaxEdgesValue.textContent = 'All'
                // Enable simplify factor when maxEdges is disabled
                objSimplifySlider.disabled = false
            } else {
                objProcessingSettings.maxEdges = value
                objMaxEdgesValue.textContent = value.toString()
                // Disable simplify factor when maxEdges is active
                objSimplifySlider.disabled = true
            }
        })

        const objSimplifySlider = /** @type {HTMLInputElement} */ (document.getElementById('objSimplifySlider'))
        const objSimplifyValue = document.getElementById('objSimplifyValue')
        objSimplifySlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value)
            objProcessingSettings.simplifyFactor = value
            objSimplifyValue.textContent = value.toString()
            // If simplify factor is set to > 1, disable maxEdges and reset it
            if (value > 1) {
                objMaxEdgesSlider.disabled = true
                objProcessingSettings.maxEdges = null
                objMaxEdgesValue.textContent = 'All'
                objMaxEdgesSlider.value = '0'
            } else {
                // When simplifyFactor is 1, enable maxEdges
                objMaxEdgesSlider.disabled = false
            }
        })

        // Initialize control states
        objSimplifySlider.disabled = false
        objMaxEdgesSlider.disabled = false

        const reprocessOBJBtn = document.getElementById('reprocessOBJ')
        reprocessOBJBtn.addEventListener('click', () => {
            if (rawOBJContent) {
                processOBJModel(rawOBJContent, rawOBJFileName || 'model.obj')
            }
        })

        // Initialize info
        updateModelInfo(currentModel, 'torus')

        animate()
    </script>
</body>

</html>
